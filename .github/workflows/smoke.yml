name: Smoke test scrapers

# Manual-only connectivity test: runs every scraper against ONE region per
# source (run_all.py --smoke) to confirm the upstream sites are reachable
# from GitHub-hosted runners. Smoke mode writes only data_raw/smoke_*.json
# (real data files are untouched), skips merge/MyMaps, and exits nonzero
# only if EVERY source failed. Nothing is committed; the smoke_*.json
# files are uploaded as an artifact for inspection.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Unit tests (fetch retry regression)
        # No network. Proves IncompleteRead is retried before we hit live
        # sources - the exact failure mode of the 2026-08-03 weekly run.
        run: |
          python -m pip install --quiet pytest
          python -m pytest scrapers/test_fetch_retry.py -q --tb=short

      - name: Run scrapers in smoke mode (one region per source)
        run: python scrapers/run_all.py --smoke

      - name: Upload smoke output files as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-output
          path: data_raw/smoke_*.json
          if-no-files-found: warn
          retention-days: 7
