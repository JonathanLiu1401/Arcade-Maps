name: Update arcade data

on:
  workflow_dispatch:
  schedule:
    # Weekly: Monday 18:00 UTC = Tuesday 03:00 JST, a quiet window for the
    # Japanese source sites (ALL.Net / eagate). Keep this off-peak for JST.
    - cron: '0 18 * * 1'

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # 150 min was not enough: the 2026-08-18 dispatch died at BemaniCN
    # city 389/392 after eagate had already succeeded. ZIv + merge still
    # need a tail. GitHub-hosted max is 360.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Scrapers are stdlib-only today, so there is nothing to install.
      # If a third-party dependency is ever added, uncomment:
      # - run: python -m pip install -r requirements.txt

      - name: Unit tests (fetch retry + merge guards)
        # Cheap, no network. Catches the class of bug that killed the
        # 2026-08-03 weekly run (IncompleteRead not retried) before we
        # spend an hour crawling. Fail here -> nothing is scraped or
        # committed; previous data stays live.
        run: |
          python -m pip install --quiet pytest
          python -m pytest scrapers/test_fetch_retry.py \
            scrapers/test_stable_sid.py \
            scrapers/test_counts_honesty.py \
            scrapers/test_build_corrections.py \
            scrapers/test_run_all_keep_previous.py \
            scrapers/test_keep_games.py \
            -q --tb=short

      - name: Scrape all sources
        # Fetches retry with backoff, including IncompleteRead (the
        # 2026-08-03 weekly killer) and HTTP 429/502/503/504 with a
        # longer WAF cool-down (the 2026-08-17 weekly killer: eagate
        # 503 x3 in 7s aborted the job after ALL.Net had already
        # finished). Empty parses and ZIv empty-country 200s still
        # fail the job. A FetchError after retries keeps the previous
        # data_raw file for that game/source and continues so other
        # sources can still land. continue-on-error stays false so a
        # real parser bug can never half-commit empty files.
        #
        # Tolerant-failure exceptions (still exit 0 for the pipeline):
        #   * FX rates (scrapers/fx.py): if both frankfurter and open.er-api
        #     fail, the previous data/fx_rates.json is retained and the
        #     step warns instead of aborting, so arcade data can still land.
        #   * Arcade FetchError after retries (site down / WAF 503): keep
        #     the previous data_raw file for that game/source, skip the
        #     rest of that host, continue other sources.
        #   * Individual ZIV countries that return rows are required; an
        #     empty country is hard-fail (spelling drift guard).
        #   * BemaniCN per-city / per-shop FetchError after retries: the
        #     city is skipped and retried once at the end; the crawl
        #     continues so one flaky city cannot zero the whole China set.
        continue-on-error: false
        run: python scrapers/run_all.py

      - name: Fetch FX rates
        # Redundant with the fx step inside run_all.py, but kept as an
        # explicit named step so CI logs surface FX status clearly and so a
        # future split of scrape vs post-process stays easy. Non-fatal:
        # scrapers/fx.py exits 0 even when both feeds fail (keeps previous
        # file). continue-on-error is true as belt-and-suspenders.
        continue-on-error: true
        run: python scrapers/fx.py --out data

      - name: Guard against a shrinking dataset
        # Last line of defence before this lands on main and Pages serves it
        # minutes later. The guards above catch LOUD failures: a source that
        # returns nothing, a ZIv country whose spelling drifted. None of them
        # catch a quiet shrink - an upstream that answers every request but
        # returns a third of its rows, a parser that stops matching after a
        # markup change - because the result is a smaller but perfectly
        # well-formed dataset.
        #
        # It compares the fresh build against what is already committed and
        # fails the job when the drop is implausible, so nothing is committed
        # and the previous data stays live. Note it checks data_raw/ as well
        # as data/: dedupe folds most community rows into official entries, so
        # a 30% collapse in raw ZIv rows moved the merged arcade total by only
        # 0.5% and would have passed a merged-only check.
        #
        # Growth is never blocked. If a shrink is real, re-run this workflow
        # from the Actions tab after raising the thresholds, or run the script
        # locally with --force and commit by hand.
        run: python scrapers/guard_regression.py

      - name: Commit refreshed data if changed
        # The scrape takes ~2.5h. main often moves while it runs (UI
        # commits). A bare git push then dies with "fetch first", which
        # is how the 2026-08-24 weekly lost a finished crawl (run
        # 32763382083). Rebase onto origin/main before push; data files
        # almost never overlap those UI commits.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ data_raw/ mymaps/ s/
          git add data/fx_rates.json data/enrichment.json data/china_areas.json data/hk_romanize.json
          git diff --cached --quiet || git commit -m "data: automated refresh $(date -u +%F)"
          git fetch origin main
          git pull --rebase origin main
          git push origin HEAD:main
